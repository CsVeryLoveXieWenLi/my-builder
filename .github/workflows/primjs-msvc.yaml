name: Build PrimJS (Windows MSVC)

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'PrimJS 仓库路径 (owner/repo)'
        required: true
        default: 'lynx-dev/primjs'
      crt_type:
        description: '选择 C++ 运行时库 (CRT Type)'
        required: true
        default: 'MT'
        type: choice
        options:
          - 'MT'
          - 'MD'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Fetch Latest PrimJS Release Source
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.event.inputs.repo }}
        run: |
          Write-Host "Fetching latest release from $env:TARGET_REPO using GitHub CLI..."
          
          # 1. 获取最新 Release 的 Tag 名称
          $tagName = gh release view --repo $env:TARGET_REPO --json tagName --jq .tagName
          if (-not $tagName) {
            Write-Error "Failed to fetch latest release tag. Please check if the repository exists and has a release."
            exit 1
          }
          Write-Host "Latest Release Tag: $tagName"
          
          # 2. 下载源码 Zip 包
          gh release download $tagName --repo $env:TARGET_REPO --archive=zip --output "primjs-src.zip"
          
          # 3. 解压并整理源码至 src 目录
          Expand-Archive -Path "primjs-src.zip" -DestinationPath "primjs-temp"
          $extractedDir = Get-ChildItem -Path "primjs-temp" | Where-Object { $_.PSIsContainer } | Select-Object -First 1
          
          New-Item -ItemType Directory -Path "src" -Force
          Move-Item -Path "$($extractedDir.FullName)\*" -Destination "src" -Force
          Remove-Item -Path "primjs-temp", "primjs-src.zip" -Recurse -Force
          
          # 4. 写入环境变量供后续 Step 读取
          "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          $crtChoice = "${{ github.event.inputs.crt_type }}"
          
          # MT 映射为 MultiThreaded，MD 映射为 MultiThreadedDLL
          if ($crtChoice -eq "MT") {
            $msvcCrt = "MultiThreaded"
          } else {
            $msvcCrt = "MultiThreadedDLL"
          }

          Write-Host "Configuring CMake with MSVC Runtime: $msvcCrt"
          
          # 直接使用 Windows Runner 内置的 Visual Studio 2022 生成器 (无需额外配置 Ninja)
          cmake -B build -S src `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=$msvcCrt

      - name: Build PrimJS
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: primjs-${{ env.RELEASE_TAG }}-windows-x64-${{ github.event.inputs.crt_type }}
          path: |
            build/**/*.exe
            build/**/*.dll
            build/**/*.lib
          if-no-files-found: warn
