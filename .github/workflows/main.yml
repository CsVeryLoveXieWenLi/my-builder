name: Build EXE with Nuitka (Python 3.13t + MSVC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 下载源码ZIP包 (使用PowerShell)
    - name: Download source package
      run: |
        $url = "http://43.226.128.77:16679/python-aliyun-v2%20%281%29.zip"
        $output = "source.zip"
        Invoke-WebRequest -Uri $url -OutFile $output
        Expand-Archive -Path $output -DestinationPath . -Force
      shell: powershell

    # 2. 配置 MSVC 编译环境
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # 3. 安装 Python 3.13t
    - name: Setup Python 3.13t
      uses: actions/setup-python@v5
      with:
        python-version: '3.13t'
        check-latest: true

    # 4. 验证 Python 环境
    - name: Verify Python
      run: |
        python -c "import sys; print(f'Version: {sys.version}')"
        python -c "import sys; print('Free-threaded' if sys._is_gil_enabled() is False else 'GIL enabled')"
      shell: powershell

    # 5. 设置pip镜像源 (清华源)
    - name: Set pip mirror
      run: |
        python -m pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
      shell: powershell

    # 6. 安装 Nuitka 和项目依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install nuitka
        pip install -r requirements.txt
      shell: powershell

    # 7. 使用 Nuitka 打包
    - name: Build with Nuitka
      run: |
        python -m nuitka --standalone --onefile `
          --msvc=latest `
          --output-dir=build `
          --remove-output `
          your_main_script.py
      shell: powershell

    # 8. 上传 exe
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-exe
        path: build/*.exe
