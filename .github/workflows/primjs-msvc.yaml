name: Build PrimJS (Windows MSVC)

on:
  workflow_dispatch:
    inputs:
      crt_type:
        description: '选择 C++ 运行时库 (CRT Type)'
        required: true
        default: 'MT'
        type: choice
        options:
          - 'MT'
          - 'MD'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. 克隆 PrimJS 仓库
      - name: Checkout PrimJS
        uses: actions/checkout@v4
        with:
          repository: 'lynx-family/primjs'
          fetch-depth: 0

      # 2. 自动切换到最新的 Release / Tag (若无则保留在主分支)
      - name: Checkout Latest Tag
        shell: bash
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "Checking out latest tag: $LATEST_TAG"
            git checkout "$LATEST_TAG"
            echo "RELEASE_TAG=$LATEST_TAG" >> $GITHUB_ENV
          else
            echo "No tag found, building default branch."
            echo "RELEASE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      # 3. 初始化 Windows MSVC (x64) 编译环境
      - name: Setup MSVC Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 4. 载入环境脚本并运行 hab 同步依赖项
      - name: Sync Dependencies with hab
        shell: bash
        run: |
          source tools/envsetup.sh
          hab sync .

      # 5. GN 生成构建配置 (配置 Release 参数及 MSVC CRT 标记)
      - name: Generate Build Files (GN)
        shell: bash
        run: |
          source tools/envsetup.sh
          
          CRT_FLAG="/${{ github.event.inputs.crt_type }}"
          
          # 设置 Release 构建 (is_debug=false) 并透传 MT/MD 编译参数
          gn gen out/Release --args="is_debug=false target_cpu=\"x64\" extra_cflags=\"$CRT_FLAG\" extra_cppflags=\"$CRT_FLAG\""

      # 6. 使用 Ninja 编译主二进制可执行文件 qjs
      - name: Build qjs_exe (Ninja)
        shell: bash
        run: |
          source tools/envsetup.sh
          ninja -C out/Release qjs_exe

      # 7. 打包产物上传
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: primjs-${{ env.RELEASE_TAG }}-windows-x64-${{ github.event.inputs.crt_type }}
          path: |
            out/Release/qjs.exe
            out/Release/*.dll
            out/Release/*.lib
          if-no-files-found: warn
