name: Build EXE with Nuitka (Python 3.13t + MSVC)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    # 1. 下载源码ZIP包
    - name: Download source package
      run: |
        $url = "https://tmp.pank.org/dkopqh9y/python-aliyun-v2.zip"
        $output = "source.zip"
        Invoke-WebRequest -Uri $url -OutFile $output
        Expand-Archive -Path $output -DestinationPath . -Force
      shell: powershell

    # 2. 配置 MSVC 编译环境
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1

    # 3. 安装 Python 3.13 (!free-threaded)
    - name: Setup Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        check-latest: true

    # 4. 验证 Python 环境
    - name: Verify Python
      run: |
        python -c "import sys; print(f'Version: {sys.version}')"
        python -c "import sys; print('Free-threaded' if sys._is_gil_enabled() is False else 'GIL enabled')"
      shell: powershell

    # 5. 设置pip镜像源 (清华源)
    - name: Set pip mirror
      run: |
        python -m pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
      shell: powershell

    # 6. 测试安装 opencv 和 onnxruntime
    - name: Test install opencv and onnxruntime
      run: |
        python -m pip install --upgrade pip
        pip install opencv-python-headless
        pip install onnxruntime
      shell: powershell

    # 7. 验证导入是否成功
    - name: Verify imports
      run: |
        python -c "import cv2; print('OpenCV loaded successfully')"
        python -c "import onnxruntime as ort; print(f'ONNX Runtime loaded, version: {ort.__version__}')"
      shell: powershell

    # 8. 安装其他依赖
    - name: Install other dependencies
      run: |
        pip install httpx
        pip install pycryptodome
        pip install cheroot
        pip install flask
      shell: powershell

    # 9. 使用 Nuitka 打包
    - name: Build with Nuitka
      run: |
        python -m nuitka --standalone --onefile `
          --msvc=latest `
          --output-dir=build `
          --remove-output `
          main.py
      shell: powershell

    # 10. 上传 exe
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-exe
        path: build/*.exe
