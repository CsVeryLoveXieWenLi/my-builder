name: Build V8 - Windows MSVC

on:
  workflow_dispatch:

jobs:
  build-msvc:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        crt: [MD, MT] # 分别构建 MD 和 MT 两个版本

    steps:
      - name: Free Disk Space
        shell: powershell
        run: |
          Get-PSDrive
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue

      - name: Install depot_tools
        shell: powershell
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git C:\depot_tools
          echo "C:\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Fetch V8 Source
        shell: cmd
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          mkdir v8_build && cd v8_build
          fetch v8
          cd v8
          git checkout branch-heads/12.4
          gclient sync

      - name: Patch CRT for /MT
        if: matrix.crt == 'MT'
        shell: powershell
        run: |
          cd v8_build/v8
          (Get-Content build/config/win/BUILD.gn) -replace 'dynamic_crt', 'static_crt' | Set-Content build/config/win/BUILD.gn

      - name: GN Gen & Ninja Build
        shell: cmd
        run: |
          set DEPOT_TOOLS_WIN_TOOLCHAIN=0
          cd v8_build/v8
          gn gen out/Release "--args=is_debug=false symbol_level=0 is_component_build=false v8_static_library=true v8_enable_webassembly=false v8_enable_i18n_support=false v8_use_external_startup_data=false is_clang=false target_cpu=\"x64\""
          ninja -C out/Release v8_monolith

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: v8-windows-x64-msvc-${{ matrix.crt }}
          path: v8_build/v8/out/Release/obj/v8_monolith.lib
