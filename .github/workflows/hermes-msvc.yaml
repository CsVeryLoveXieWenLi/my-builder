name: Build Hermes (Windows)

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: 'MSVC Runtime Library'
        type: choice
        options:
          - MT
          - MD
        default: 'MT'
      configuration:
        description: 'Build Configuration'
        type: choice
        options:
          - Release
          - Debug
        default: 'Release'
      library_type:
        description: 'Library Type'
        type: choice
        options:
          - Static
          - Shared
        default: 'Static'

jobs:
  build:
    name: Build Hermes
    runs-on: windows-2022

    steps:
      # 1. 先获取最新的 release tag（不需要克隆代码）
      - name: Get latest release tag
        id: latest_release
        shell: bash
        run: |
          tag=$(curl -s https://api.github.com/repos/facebook/hermes/releases/latest | jq -r .tag_name)
          echo "tag_name=$tag" >> $GITHUB_OUTPUT

      # 2. 用获取到的 tag 检出 Hermes 源码到 hermes/ 子目录
      - name: Checkout Hermes source
        uses: actions/checkout@v4
        with:
          repository: facebook/hermes
          ref: ${{ steps.latest_release.outputs.tag_name }}
          path: hermes   # 关键：防止覆盖工作目录

      # 3. 配置 Visual Studio 环境
      - name: Setup Visual Studio
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      # 4. CMake 配置（极简编译，全部参考官方参数）
      - name: Configure CMake
        shell: bash
        run: |
          # 根据 runtime 和 configuration 计算 MSVC_RUNTIME_LIBRARY 值
          if [[ "${{ github.event.inputs.configuration }}" == "Release" ]]; then
            if [[ "${{ github.event.inputs.runtime }}" == "MT" ]]; then
              RUNTIME="MultiThreaded"
            else
              RUNTIME="MultiThreadedDLL"
            fi
          else
            if [[ "${{ github.event.inputs.runtime }}" == "MT" ]]; then
              RUNTIME="MultiThreadedDebug"
            else
              RUNTIME="MultiThreadedDebugDLL"
            fi
          fi

          # 决定是否生成动态库
          if [[ "${{ github.event.inputs.library_type }}" == "Shared" ]]; then
            SHARED="ON"
          else
            SHARED="OFF"
          fi

          # 极简编译：关闭调试器、国际化、分析器、模糊测试（都是官方 CMake 选项）
          cmake -S ./hermes -B ./build \
            -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.configuration }} \
            -DCMAKE_MSVC_RUNTIME_LIBRARY="$RUNTIME" \
            -DBUILD_SHARED_LIBS="$SHARED" \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DHERMESVM_COMPRESSED_POINTERS=OFF \
            -DHERMES_ENABLE_DEBUGGER=OFF \
            -DHERMES_ENABLE_INTL=OFF \
            -DHERMES_ENABLE_PROFILER=OFF \
            -DHERMES_ENABLE_LIBFUZZER=OFF

      # 5. 编译（多核并行）
      - name: Build Hermes
        run: cmake --build ./build --config ${{ github.event.inputs.configuration }} --parallel

      # 6. 上传制品
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ github.event.inputs.configuration }}-${{ github.event.inputs.runtime }}-${{ github.event.inputs.library_type }}
          path: |
            build/bin/*.exe
            build/*.lib
            build/*.dll
            build/*.pdb
          if-no-files-found: warn
