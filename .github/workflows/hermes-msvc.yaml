name: Build Hermes (Windows)

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: 'MSVC Runtime Library'
        type: choice
        options:
          - MT  # 静态链接运行时 (/MT, /MTd)
          - MD  # 动态链接运行时 (/MD, /MDd)
        default: 'MT'
      configuration:
        description: 'Build Configuration'
        type: choice
        options:
          - Release
          - Debug
        default: 'Release'
        # Release → /MT 或 /MD，Debug → /MTd 或 /MDd
      library_type:
        description: 'Library Type'
        type: choice
        options:
          - Static
          - Shared
        default: 'Static'

jobs:
  build:
    name: Build Hermes
    runs-on: windows-2022

    steps:
      - name: Checkout Hermes
        uses: actions/checkout@v4
        with:
          repository: facebook/hermes
          # 获取最新 release tag
          ref: ${{ steps.latest_release.outputs.tag_name }}

      - name: Get latest release tag
        id: latest_release
        shell: bash
        run: |
          tag=$(curl -s https://api.github.com/repos/facebook/hermes/releases/latest | jq -r .tag_name)
          echo "tag_name=$tag" >> $GITHUB_OUTPUT

      - name: Setup Visual Studio
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Configure CMake
        shell: bash
        run: |
          # 根据 configuration 和 runtime 组合确定 MSVC_RUNTIME_LIBRARY 值
          # Release + MT → MultiThreaded, Debug + MT → MultiThreadedDebug
          # Release + MD → MultiThreadedDLL, Debug + MD → MultiThreadedDebugDLL
          if [[ "${{ github.event.inputs.configuration }}" == "Release" ]]; then
            if [[ "${{ github.event.inputs.runtime }}" == "MT" ]]; then
              RUNTIME="MultiThreaded"
            else
              RUNTIME="MultiThreadedDLL"
            fi
          else
            if [[ "${{ github.event.inputs.runtime }}" == "MT" ]]; then
              RUNTIME="MultiThreadedDebug"
            else
              RUNTIME="MultiThreadedDebugDLL"
            fi
          fi

          # BUILD_SHARED_LIBS: ON → Shared, OFF → Static
          if [[ "${{ github.event.inputs.library_type }}" == "Shared" ]]; then
            SHARED_LIBS="ON"
          else
            SHARED_LIBS="OFF"
          fi

          # 极简编译选项：关闭非必要功能以减小体积和加快编译
          # - HERMES_ENABLE_DEBUGGER=OFF：关闭调试器支持[reference:0]
          # - HERMES_ENABLE_INTL=OFF：关闭国际化支持，减少体积[reference:1]
          # - HERMES_ENABLE_PROFILER=OFF：关闭性能分析器[reference:2]
          # - HERMES_ENABLE_LIBFUZZER=OFF：关闭模糊测试[reference:3]
          cmake -S hermes -B build \
            -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_BUILD_TYPE=${{ github.event.inputs.configuration }} \
            -DCMAKE_MSVC_RUNTIME_LIBRARY="$RUNTIME" \
            -DBUILD_SHARED_LIBS="$SHARED_LIBS" \
            -DHERMES_ENABLE_DEBUGGER=OFF \
            -DHERMES_ENABLE_INTL=OFF \
            -DHERMES_ENABLE_PROFILER=OFF \
            -DHERMES_ENABLE_LIBFUZZER=OFF

      - name: Build Hermes
        run: cmake --build ./build --config ${{ github.event.inputs.configuration }} --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-windows-${{ github.event.inputs.configuration }}-${{ github.event.inputs.runtime }}-${{ github.event.inputs.library_type }}
          path: |
            build/bin/*.exe
            build/*.lib
            build/*.dll
            build/*.pdb
          if-no-files-found: warn
